# Configuration for cargo-deny
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Ignore paste unmaintained warning (transitive via metal / wgpu-hal; no direct replacement available)
ignore = ["RUSTSEC-2024-0436"]

[licenses]
# Allow commonly used licenses for Rust projects
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Zlib",           # foldhash, slotmap
    "CC0-1.0",        # hexf-parse (public domain)
    "ISC",            # libloading
    "MPL-2.0",        # option-ext
]

# zstd-rs v0.14.0 relicensed its bindings to BSD-3-Clause.
# Limit approval to the reviewed versions; recheck upstream licenses on upgrades.
# https://github.com/gyscos/zstd-rs/tree/v0.14.0
[[licenses.exceptions]]
name = "zstd"
version = "=0.14.0"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "zstd-safe"
version = "=8.0.0"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "zstd-sys"
version = "=2.1.0"
allow = ["BSD-3-Clause"]

[bans]
# Deny multiple versions of the same crate (helps reduce bloat)
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
# Ensure all crates come from trusted sources
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
